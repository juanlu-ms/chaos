name: Tests & Quality

on:
  push:
    branches:
      - "**"

jobs:
  formatting:
    name: Check Code Formatting
    runs-on: ubuntu-24.04
    env:
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

    steps:
      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - uses: actions/checkout@v6

      - name: Install Clang-Format 18 & Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18 ninja-build
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup vcpkg and Cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'
        
      - name: Check formatting
        run: cmake --workflow --preset check-format

  build_and_test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Release Build"
            config_preset: "release-linux-clang"
            build_preset: "release"
            test_cmd: "ctest --preset test-release"
            cmake_args: ""
          
          - name: "Memory Check (ASan/UBSan)"
            config_preset: "dev-linux-clang"
            build_preset: "debug"
            test_cmd: "ctest --preset test-debug"
            cmake_args: "-DCHAOS_ENABLE_ASAN_UBSAN=ON"
          
          - name: "Concurrency Check (TSan)"
            config_preset: "dev-linux-clang"
            build_preset: "debug"
            test_cmd: "ctest --preset test-debug"
            cmake_args: "-DCHAOS_ENABLE_TSAN=ON"
            
          - name: "Code Coverage"
            config_preset: "dev-linux-clang"
            build_preset: "debug"
            test_cmd: "cmake --build build/dev-linux-clang --target coverage_report"
            cmake_args: "-DCHAOS_ENABLE_COVERAGE=ON"

    env:
      CC: clang-18
      CXX: clang++-18
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install Toolchain (Clang 18 & Headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            lld-18 \
            libstdc++-14-dev \
            ninja-build
          
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-clang-18-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-clang-18-${{ matrix.name }}-
          max-size: 1G

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup vcpkg and Cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build Web UI
        working-directory: frontend
        run: pnpm install && pnpm run build

      - name: Configure CMake
        run: cmake --preset ${{ matrix.config_preset }} ${{ matrix.cmake_args }}

      - name: Build C++ Backend
        run: cmake --build --preset ${{ matrix.build_preset }}

      - name: Run Tests & Quality Checks
        run: ${{ matrix.test_cmd }}

      - name: Upload Coverage Artifact (Only for Coverage job)
        if: matrix.name == 'Code Coverage'
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: build/dev-linux-clang/coverage.lcov
          if-no-files-found: ignore
