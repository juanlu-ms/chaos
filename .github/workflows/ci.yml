name: Tests & Quality

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  formatting:
    name: Check Code Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Clang-Format 18 & Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18 ninja-build
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100

      - name: Setup CMake
        uses: lukka/get-cmake@v3.31.6

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'

      - name: Check formatting
        run: cmake --workflow --preset check-format

  build_and_test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Release Build"
            config_preset: "release-linux-clang"
            build_preset: "release"
            test_cmd: "sudo ctest --preset test-release"
            cmake_args: ""
          
          - name: "Memory Check (ASan/UBSan)"
            config_preset: "ci-asan-ubsan"
            build_preset: "debug-asan"
            test_cmd: "ctest --preset test-asan -L unit"
            cmake_args: ""
          
          - name: "Concurrency Check (TSan)"
            config_preset: "ci-tsan"
            build_preset: "debug-tsan"
            test_cmd: "ctest --preset test-tsan -L unit"
            cmake_args: ""
            
          - name: "Code Coverage"
            config_preset: "ci-coverage"
            build_preset: "debug-cov"
            test_cmd: "cmake --build build/ci-coverage --target coverage_report"
            cmake_args: ""

    env:
      CC: clang-18
      CXX: clang++-18
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install Toolchain (Clang 18 & Headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            lld-18 \
            libstdc++-14-dev \
            ninja-build
          
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-clang-18-${{ matrix.name }}
          max-size: 2G

      - name: Setup CMake
        uses: lukka/get-cmake@v3.31.6

      - name: Setup vcpkg and Cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'

      - name: Setup pnpm
        if: matrix.name == 'Release Build'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        if: matrix.name == 'Release Build'
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Configure CMake
        run: cmake --preset ${{ matrix.config_preset }} ${{ matrix.cmake_args }}

      - name: Build C++ Backend
        run: cmake --build --preset ${{ matrix.build_preset }} -- -j$(nproc)

      - name: ccache stats
        run: ccache -s

      - name: Enable nsenter for e2e network tests
        if: matrix.name == 'Release Build'
        run: sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Run Tests & Quality Checks
        env:
          TSAN_OPTIONS: ${{ contains(matrix.name, 'TSan') && 'die_after_fork=0:history_size=5:verbosity=0' || '' }}
        run: ${{ matrix.test_cmd }}

      - name: Package release binary
        if: startsWith(github.ref, 'refs/tags/v') && matrix.name == 'Release Build'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"            # vX.X.X -> X.X.X
          NAME="chaos-${VERSION}-linux-x86_64"
          cp build/release-linux-clang/orchestrator/chaos "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"

          echo "--- file"
          file "$NAME"
          echo "--- dynamic libraries linked"
          ldd "$NAME"

          # The binary is dynamically linked, so these two symbol versions are the
          # platform contract advertised in docs/USER_GUIDE.md. Fail the release if a
          # toolchain or dependency bump raises the floor without the docs following.
          GLIBC_MAX=$(objdump -T "$NAME" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          GLIBCXX_MAX=$(objdump -T "$NAME" | grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -1)
          echo "--- max symbol versions required: $GLIBC_MAX / $GLIBCXX_MAX"
          if [ "$GLIBC_MAX" != "GLIBC_2.38" ] || [ "$GLIBCXX_MAX" != "GLIBCXX_3.4.32" ]; then
            echo "::error::Platform floor changed to $GLIBC_MAX / $GLIBCXX_MAX (docs claim GLIBC_2.38 / GLIBCXX_3.4.32)."
            echo "::error::Update the supported-distribution list in docs/USER_GUIDE.md and README.md, then adjust this check."
            exit 1
          fi

      - name: Upload Release Binary
        if: startsWith(github.ref, 'refs/tags/v') && matrix.name == 'Release Build'
        uses: actions/upload-artifact@v4
        with:
          name: chaos-release-binary
          path: |
            chaos-*-linux-x86_64
            chaos-*-linux-x86_64.sha256
          if-no-files-found: error

      - name: Upload Coverage Artifact (Only for Coverage job)
        if: matrix.name == 'Code Coverage'
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: build/ci-coverage/coverage.lcov
          if-no-files-found: error

  publish_release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [formatting, build_and_test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chaos-release-binary

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chaos-*-linux-x86_64
            chaos-*-linux-x86_64.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
