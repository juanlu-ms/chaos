name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-24.04

    env:
      CC: clang-18
      CXX: clang++-18
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install Toolchain (Clang 18, LLD, Headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            lld-18 \
            libstdc++-14-dev \
            ninja-build

          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-clang-18-release
          max-size: 2G

      - name: Setup CMake
        uses: lukka/get-cmake@v3.31.6

      - name: Setup vcpkg and Cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Configure CMake (Release)
        run: cmake --preset release-linux-clang

      - name: Build C++ Backend
        run: cmake --build --preset release -- -j$(nproc)

      - name: ccache stats
        run: ccache -s

      - name: Enable nsenter for e2e network tests
        run: sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Run Tests
        run: sudo ctest --preset test-release

      - name: Verify binary linkage
        run: |
          echo "Dynamic libraries linked:"
          ldd build/release-linux-clang/orchestrator/chaos || true
          echo "---"
          file build/release-linux-clang/orchestrator/chaos

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/release-linux-clang/orchestrator/chaos
          generate_release_notes: true
