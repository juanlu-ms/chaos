name: Tests

on:
  push:
    branches:
      - "**"

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

    steps:
      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install CMake and Ninja (cached)
        uses: lukka/get-cmake@latest

      - name: Get vcpkg submodule commit
        id: vcpkg-commit
        run: echo "sha=$(git submodule status vcpkg | awk '{print $1}' | tr -d ' -')" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg directory
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            !${{ env.VCPKG_ROOT }}/buildtrees
            !${{ env.VCPKG_ROOT }}/packages
            !${{ env.VCPKG_ROOT }}/downloads
            !${{ env.VCPKG_ROOT }}/installed
          key: vcpkg-${{ steps.vcpkg-commit.outputs.sha }}
          restore-keys: vcpkg-

      - name: Verify vcpkg toolchain
        run: test -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Check formatting (configures dev-linux-clang, builds check-format target)
        run: cmake --workflow --preset check-format

      - name: Configure release build
        run: cmake --preset release-linux-gcc

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset test
