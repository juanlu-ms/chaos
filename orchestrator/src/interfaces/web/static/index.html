<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHAOS — Resilience Testing</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="topbar">
    <span class="logo">CHAOS</span>
    <span class="badge" id="status-badge">Connecting...</span>
    <div class="nav-links">
      <button class="nav-btn active" data-view="dashboard">Dashboard</button>
      <button class="nav-btn" data-view="builder">Manifest Builder</button>
    </div>
  </nav>

  <!-- DASHBOARD -->
  <section id="view-dashboard" class="view active">
    <header class="section-header">
      <h2>Targets</h2>
      <button class="btn sm" id="refresh-targets">Refresh</button>
    </header>
    <div class="target-grid" id="target-grid">
      <div class="empty-state">No containers detected.</div>
    </div>
    <header class="section-header"><h2>System Limits</h2></header>
    <div class="limits-card" id="limits-card">
      <div class="metric"><span class="label">CPU Cores</span><span class="value" id="limit-cpu">--</span></div>
      <div class="metric"><span class="label">Memory</span><span class="value" id="limit-mem">--</span></div>
    </div>
  </section>

  <!-- MANIFEST BUILDER + MONITOR -->
  <section id="view-builder" class="view">
    <div class="builder-layout">
      <div class="builder-form">
        <h2>New Chaos Scenario</h2>
        <label>Test Name</label>
        <input type="text" id="field-name" placeholder="my-resilience-test" value="Untitled Test">
        <label>Target Container</label>
        <select id="field-target"></select>
        <label>Duration (seconds)</label>
        <input type="number" id="field-duration" min="0" max="3600" value="10">
        <fieldset>
          <legend>Perturbations <button class="btn xs" id="add-perturbation">+ Add</button></legend>
          <div id="perturbation-list"></div>
        </fieldset>
        <fieldset>
          <legend>Expectations</legend>
          <div id="expectation-list"></div>
          <button class="btn xs" id="add-expectation">+ Add Expectation</button>
        </fieldset>
        <button class="btn primary" id="run-btn">▶ Run Scenario</button>
      </div>
      <div class="monitor-panel" id="monitor-panel" style="display:none">
        <h2>Live Monitor <span class="chip pending" id="run-status-chip">Pending</span></h2>
        <div class="state-card" id="state-card">
          <div class="metric"><span class="label">Status</span><span class="value" id="mon-status">--</span></div>
          <div class="metric"><span class="label">CPU</span><span class="value" id="mon-cpu">--</span></div>
          <div class="metric"><span class="label">Memory</span><span class="value" id="mon-mem">--</span></div>
          <progress id="mon-progress" value="0" max="100"></progress>
        </div>
        <pre class="log-view" id="mon-logs">Waiting for state updates...</pre>
        <div id="results-panel" style="display:none">
          <h3>Results</h3>
          <ul id="result-list"></ul>
        </div>
      </div>
    </div>
  </section>

  <script src="/assets/app.js"></script>
</body>
</html>
